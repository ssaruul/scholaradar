use_default_settings: true

general:
  debug: false
  instance_name: scholarship-radar search
  enable_metrics: false

server:
  secret_key: "replaced-by-SEARXNG_SECRET-env"
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET

search:
  safe_search: 0
  autocomplete: ""
  default_lang: all
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 50
  pool_maxsize: 20

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: currency
    disabled: true
  - name: dictzone
    disabled: true
