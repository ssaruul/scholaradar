name: tests
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "reports/**", "assets/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run scholaradar --help
