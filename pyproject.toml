[project]
name = "scholaradar"
version = "0.1.0"
description = "Daily self-hosted scholarship discovery with local-LLM eligibility checks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.0"]

[project.scripts]
scholaradar = "scholaradar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholaradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
